services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - db-data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "8081:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../pwa/dist:/srv/pwa:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    restart: unless-stopped

  # Ollama: use the host-installed instance (already running on port 11434).
  # The backend container reaches it via host.docker.internal or
  # extra_hosts when LLM integration arrives in bite 4.

volumes:
  db-data:
  caddy-data:
  caddy-config:
